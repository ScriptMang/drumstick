name: CI Checks

on:
  push:
    branches:
      - main
jobs:
  build:
    name Build App
  runs-on: ubuntu-latest
  steps:

    - name: Set up Go 1.25.0
      uses: actions/setup-go@v4
      with:
        go-version: ^1.25.0

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Build
      uses: make build

    - name: Copy Files
      run: |
           mkdir artifacts
           cp drumstick artifacts/.

    - name: Archive
      uses: actions/upload-artifact@v4
      with:
        name: drumstick
        path: artifacts
