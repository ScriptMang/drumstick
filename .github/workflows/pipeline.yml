name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.7
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: drumstick_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Install netcat
        run: sudo apt-get update && sudo apt-get install -y  netcat-traditional

          
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && exit 0
            sleep 2
          done
          echo "Postgres did not start in time"
          exit 1

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Import SQL file into Postgres
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -d drumstick_test -f drumstick.sql

      - name: Run Go Tests
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: go test ./... -v


      - name: Build Go Binary
        run: go build -v ./...
